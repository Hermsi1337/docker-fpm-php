name: build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly rebuild of the WHOLE lineup. Supported versions (PHP 8.2+) pick
    # up base image + Alpine package updates; EOL versions sit on frozen bases
    # but still get a current CA trust store out of the rebuild (the cacerts
    # donor stage copies today's alpine:latest bundle into every image).
    - cron: "0 4 * * 1"

# Cancel superseded runs for the same PR; let push/dispatch/schedule runs
# finish so in-flight image pushes are never interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOCKERHUB_IMAGE: hermsi/alpine-fpm-php
  GHCR_IMAGE: ghcr.io/hermsi1337/fpm-php

jobs:
  prepare:
    name: Compute build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - id: set
        name: Build matrix from versions.yaml
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Every trigger builds the whole lineup (the weekly schedule too:
          # EOL versions get a fresh CA trust store out of each rebuild). Each
          # PHP version expands into the standard and composer variants
          # (multi-arch) plus, where a loader exists, an amd64-only ioncube
          # variant. On pull requests we build amd64 only - it is a build-only
          # validation, so there is no need to pay for arm64 emulation across
          # the whole matrix.
          matrix=$(yq -o=json '.' versions.yaml | jq -c --arg event "$EVENT_NAME" '
            {
              include: (
                .versions
                | map(
                    . as $v
                    | ( if $event == "pull_request" then "linux/amd64" else $v.platforms end ) as $plat
                    | ( if ($v.dockerfile // "") == "legacy" then "Dockerfile.legacy" else "Dockerfile" end ) as $df
                    | [ { php: $v.php, variant: "standard", platforms: $plat, latest: $v.latest, dockerfile: $df },
                        { php: $v.php, variant: "composer", platforms: $plat, latest: $v.latest, dockerfile: $df } ]
                      + ( if $v.ioncube
                          then [ { php: $v.php, variant: "ioncube", platforms: "linux/amd64", latest: $v.latest, dockerfile: $df } ]
                          else [] end )
                  )
                | add // []
              )
            }')
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "${matrix}" | jq .

  build:
    name: "PHP ${{ matrix.php }} (${{ matrix.variant }})"
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One broken (usually EOL) build must not abort the rest of the lineup.
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: ext
        name: Resolve extension list from versions.yaml
        env:
          PHP: ${{ matrix.php }}
        run: |
          set -euo pipefail
          # Single source of truth: effective list for this version is
          # extensions + extensions_add - extensions_remove. The exact same
          # computation feeds the build-arg and the smoke test below.
          extensions=$(yq -o=json '.' versions.yaml | jq -r --arg php "$PHP" '
            ( [ .versions[] | select(.php == $php) ][0] ) as $v
            | ( ( .extensions + ($v.extensions_add // []) ) - ($v.extensions_remove // []) )
            | unique
            | join(" ")
          ')
          if [ -z "$extensions" ]; then
            echo "No extensions resolved for PHP $PHP" >&2
            exit 1
          fi
          echo "list=${extensions}" >> "$GITHUB_OUTPUT"
          echo "PHP $PHP extensions: ${extensions}"

      - id: names
        name: Compute local test image name
        run: echo "image=fpm-php:ci-${{ matrix.php }}-${{ matrix.variant }}" >> "$GITHUB_OUTPUT"

      # amd64: build, load into the runner's docker, and smoke-test. Runs on
      # every trigger - on pull requests this is the whole story (build-only
      # validation, nothing is pushed). pull: true makes buildx re-resolve the
      # base images AND the alpine:latest cacerts donor stage, so a weekly
      # rebuild always embeds the current CA bundle.
      - name: Build amd64 (load)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          target: ${{ matrix.variant }}
          platforms: linux/amd64
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            PHP_EXTENSIONS=${{ steps.ext.outputs.list }}
          pull: true
          load: true
          provenance: false
          tags: ${{ steps.names.outputs.image }}
          cache-from: type=gha,scope=${{ matrix.php }}-${{ matrix.variant }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.php }}-${{ matrix.variant }}-amd64

      - name: Smoke test amd64
        run: |
          chmod +x test/smoke.sh
          ./test/smoke.sh "${{ steps.names.outputs.image }}" "${{ matrix.php }}" "${{ matrix.variant }}"

      # arm64: only where the variant targets it (standard/composer). Built with
      # QEMU emulation, loaded, and smoke-tested via `docker run --platform`.
      - name: Build arm64 (load)
        if: contains(matrix.platforms, 'arm64')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          target: ${{ matrix.variant }}
          platforms: linux/arm64
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            PHP_EXTENSIONS=${{ steps.ext.outputs.list }}
          pull: true
          load: true
          provenance: false
          tags: ${{ steps.names.outputs.image }}-arm64
          cache-from: type=gha,scope=${{ matrix.php }}-${{ matrix.variant }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.php }}-${{ matrix.variant }}-arm64

      - name: Smoke test arm64
        if: contains(matrix.platforms, 'arm64')
        run: |
          chmod +x test/smoke.sh
          ./test/smoke.sh "${{ steps.names.outputs.image }}-arm64" "${{ matrix.php }}" "${{ matrix.variant }}" "linux/arm64"

      - id: tags
        name: Compute image tags
        env:
          PHP: ${{ matrix.php }}
          VARIANT: ${{ matrix.variant }}
          LATEST: ${{ matrix.latest }}
        run: |
          set -euo pipefail
          case "$VARIANT" in
            standard) suffix="" ;;
            *)        suffix="-${VARIANT}" ;;
          esac
          {
            echo "raw<<EOF"
            echo "type=raw,value=${PHP}${suffix}"
            if [ "$LATEST" = "true" ]; then
              echo "type=raw,value=latest${suffix}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - id: meta
        name: Extract metadata
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: ${{ steps.tags.outputs.raw }}
          flavor: |
            latest=false

      # Multi-arch build + push. Only on non-PR triggers, and only after the
      # per-arch smoke tests above have passed. The per-arch layers are already
      # in the buildx cache, so this final build is a cheap cache assembly.
      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          target: ${{ matrix.variant }}
          platforms: ${{ matrix.platforms }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            PHP_EXTENSIONS=${{ steps.ext.outputs.list }}
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ matrix.php }}-${{ matrix.variant }}-amd64
            type=gha,scope=${{ matrix.php }}-${{ matrix.variant }}-arm64
